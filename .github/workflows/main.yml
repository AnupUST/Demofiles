name: demo-action
on:
  push:
    branches: test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-steps
        uses: actions/checkout@v4.2.2
      - name: printmessgae
        run: echo "Hello team"
      - name: Delete the repo
        uses: actionsforge/actions-repo-ops@v1
        with:
          # The operation to perform (create, delete, archive, update)
          operation: delete
          # Name of the repository
          repository_name: skills-hello-github-actions
          # Repository description}
          GH_REPO_TOKEN: ${{secrets.account-token}}
            

      
          
  
